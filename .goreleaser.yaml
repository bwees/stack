# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: app

before:
  hooks:
    - pnpm -C web install --frozen-lockfile
    - pnpm -C web build

builds:
  - id: app
    dir: server
    main: .
    binary: app
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: app
    ids:
      - app
    formats:
      - tar.gz
    files:
      - src: web/build/**/*
        dst: web

dockers_v2:
  - id: app
    ids:
      - app
    images:
      - ghcr.io/{{ envOrDefault "REGISTRY_IMAGE" "bwees/app" }}
    tags:
      - "v{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile
    extra_files:
      - web/build
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"

release:
  mode: keep-existing

changelog:
  disable: true
